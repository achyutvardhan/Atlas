
server.port=8080

spring.application.name=apigateway
spring.main.web-application-type=reactive

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Spring Cloud Gateway routes: forward /auth/** to serviceId 'usermodel' via discovery
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# Explicit route for auth prefix to preserve path and send to usermodel
spring.cloud.gateway.server.webflux.routes[0].id=usermodel-auth
spring.cloud.gateway.server.webflux.routes[0].uri=lb://usermodel
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=RewritePath=/auth/(?<remaining>.*), /auth/${remaining}

# Logging
logging.file.path=logs
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.cloud.loadbalancer=DEBUG
logging.level.org.springframework.cloud.client.discovery=DEBUG
logging.level.com.gateway.apigateway=DEBUG


