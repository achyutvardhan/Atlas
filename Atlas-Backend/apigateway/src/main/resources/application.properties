server.port=8080
spring.application.name=apigateway
spring.main.web-application-type=reactive

# If you don't have a Eureka server running during local development,
# prevent the client from trying to register/fetch registry (avoids NPE).
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Disable the Eureka client entirely (prevents auto-registration bean from starting)
eureka.client.enabled=false

# If you DO want to register with a Eureka server, comment the two lines above
# and set the server URL, e.g.:
# eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
