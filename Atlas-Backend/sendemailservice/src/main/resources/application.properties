server.port=8087
spring.application.name=sendemailservice
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/



spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=testatlas98@gmail.com
# Do NOT store passwords in git. Use environment variable SMTP_PASSWORD or set in CI secrets.
# spring.mail.password=${Test_password:}
spring.mail.password=
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
## Disable test-connection at startup to avoid startup failure when SMTP is temporarily unavailable
## Set to true only when you are sure credentials and connectivity are correct.
spring.mail.test-connection=true


logging.level.org.springframework.mail=DEBUG